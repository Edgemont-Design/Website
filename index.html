<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunrise Over Paris</title>
<style>
  :root {
    --dur: 14s;
    --ease: cubic-bezier(.45, .05, .25, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #0a0d1f; overflow: hidden; }
  .scene { position: fixed; inset: 0; }
  svg { width: 100%; height: 100%; display: block; }

  /* Every animated element shares one duration so the loop stays in sync. */
  .a { animation-duration: var(--dur); animation-iteration-count: infinite; animation-timing-function: var(--ease); animation-fill-mode: both; }

  /* Sky: night base, dawn layer and day layer fade in over each other */
  .sky-dawn { animation-name: dawn; }
  .sky-day  { animation-name: day; }
  @keyframes dawn { 0% {opacity:0} 35% {opacity:1} 80% {opacity:.55} 92%,100% {opacity:0} }
  @keyframes day  { 0%,30% {opacity:0} 80% {opacity:1} 92%,100% {opacity:0} }

  .stars { animation-name: stars; }
  @keyframes stars { 0%,15% {opacity:1} 45%,92% {opacity:0} 100% {opacity:1} }
  .star { animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 50% { opacity: .25; } }

  /* Sun rises from behind the ridge, then lightly drifts up */
  .sun { animation-name: rise; }
  @keyframes rise {
    0%   { transform: translateY(330px); }
    75%  { transform: translateY(-230px); }
    92%  { transform: translateY(-250px); opacity: 1; }
    100% { transform: translateY(330px); opacity: 1; }
  }
  .sun-core { animation-name: sunColor; }
  @keyframes sunColor { 0% {fill:#ff6a3d} 45% {fill:#ffb547} 80%,92% {fill:#fff2b8} 100% {fill:#ff6a3d} }

  .glow { animation-name: glow; transform-box: fill-box; transform-origin: center; }
  @keyframes glow { 0% {transform: translateY(330px) scale(.7); opacity:.2} 75% {transform: translateY(-230px) scale(1.15); opacity:.9} 92% {transform: translateY(-250px) scale(1.2); opacity:.7} 100% {transform: translateY(330px) scale(.7); opacity:0} }

  .rays { animation-name: rays; transform-origin: 800px 560px; }
  @keyframes rays { 0%,20% {opacity:0; transform: rotate(0)} 60% {opacity:.55} 92% {opacity:.35; transform: rotate(14deg)} 100% {opacity:0; transform: rotate(14deg)} }

  /* Mountain lighting: dark silhouettes warm up as sun climbs */
  .warm { animation-name: warm; }
  @keyframes warm { 0%,10% {opacity:0} 45% {opacity:.9} 85% {opacity:.35} 100% {opacity:0} }

  .mist { animation: mist 14s ease-in-out infinite alternate; }
  @keyframes mist { from { transform: translateX(-60px); } to { transform: translateX(60px); } }

  .cloud { animation-name: drift; animation-timing-function: linear; }
  @keyframes drift { from { transform: translateX(-200px); } to { transform: translateX(260px); } }

  /* Parallax: far ridges move least */
  .p1 { animation: par1 var(--dur) ease-in-out infinite alternate; }
  .p2 { animation: par2 var(--dur) ease-in-out infinite alternate; }
  .p3 { animation: par3 var(--dur) ease-in-out infinite alternate; }
  @keyframes par1 { from {transform: translateX(-6px)} to {transform: translateX(6px)} }
  @keyframes par2 { from {transform: translateX(-14px)} to {transform: translateX(14px)} }
  @keyframes par3 { from {transform: translateX(-26px)} to {transform: translateX(26px)} }

  .ripple { animation: rip 3s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes rip { from {transform: scaleX(.7); opacity:.5} to {transform: scaleX(1.1); opacity:1} }
  .refl { animation-name: refl; }
  @keyframes refl { 0%,25% {opacity:0} 70%,88% {opacity:.8} 100% {opacity:0} }

  .bird { animation: fly 14s linear infinite; }
  .bird path { animation: flap .7s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes fly { 0%,45% {transform: translate(-100px, 60px); opacity:0} 55% {opacity:1} 95% {transform: translate(1750px, -120px); opacity:1} 100% {opacity:0; transform: translate(1750px,-120px)} }
  @keyframes flap { from {transform: scaleY(1)} to {transform: scaleY(-.5)} }

  .title { font: 300 clamp(14px, 2vw, 22px)/1 "Helvetica Neue", Arial, sans-serif; letter-spacing: .5em; text-transform: uppercase; fill: #fff; animation-name: title; }
  @keyframes title { 0%,50% {opacity:0} 70%,88% {opacity:.85} 96%,100% {opacity:0} }

  @media (prefers-reduced-motion: reduce) {
    .a, .p1, .p2, .p3, .mist, .bird, .bird path, .star { animation-play-state: paused; }
  }
</style>
</head>
<body>
<div class="scene">
<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Animated sun rising behind the Eiffel Tower over the Paris skyline">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050818"/><stop offset="1" stop-color="#1b2250"/></linearGradient>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2a6b"/><stop offset=".5" stop-color="#b8548a"/><stop offset=".85" stop-color="#ff9a5a"/><stop offset="1" stop-color="#ffd27a"/></linearGradient>
    <linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f8fd8"/><stop offset=".7" stop-color="#9fd2f2"/><stop offset="1" stop-color="#fff1c9"/></linearGradient>
    <radialGradient id="glowg"><stop offset="0" stop-color="#fff3c0" stop-opacity=".95"/><stop offset=".35" stop-color="#ffb56b" stop-opacity=".45"/><stop offset="1" stop-color="#ff7a45" stop-opacity="0"/></radialGradient>
    <linearGradient id="ray" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff0b0" stop-opacity=".5"/><stop offset="1" stop-color="#fff0b0" stop-opacity="0"/></linearGradient>
    <linearGradient id="warmg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a5a" stop-opacity=".9"/><stop offset="1" stop-color="#ff9a5a" stop-opacity="0"/></linearGradient>
    <linearGradient id="mistg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe2c4" stop-opacity="0"/><stop offset="1" stop-color="#ffe2c4" stop-opacity=".55"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="above"><rect x="0" y="0" width="1600" height="640"/></clipPath>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#night)"/>
  <rect class="a sky-dawn" width="1600" height="900" fill="url(#dawn)"/>
  <rect class="a sky-day" width="1600" height="900" fill="url(#day)"/>

  <!-- Stars -->
  <g class="a stars" fill="#fff" id="starfield"></g>

  <!-- Sun + glow (clipped so it sets behind the ridge, drawn before mountains) -->
  <g clip-path="url(#above)">
    <g class="a rays" opacity="0">
      <g fill="url(#ray)">
        <polygon points="800,560 700,-200 760,-200"/><polygon points="800,560 820,-200 880,-200"/>
        <polygon points="800,560 1000,-200 1080,-200"/><polygon points="800,560 480,-200 560,-200"/>
        <polygon points="800,560 1300,-100 1380,-40"/><polygon points="800,560 240,-60 300,-120"/>
      </g>
    </g>
    <circle class="a glow" cx="800" cy="560" r="330" fill="url(#glowg)"/>
    <g class="a sun"><circle class="a sun-core" cx="800" cy="560" r="78"/></g>
  </g>

  <!-- Clouds -->
  <g fill="#fff" filter="url(#soft)" opacity=".5">
    <g class="a cloud" style="animation-duration:28s"><ellipse cx="300" cy="230" rx="150" ry="22"/><ellipse cx="380" cy="215" rx="90" ry="20"/></g>
    <g class="a cloud" style="animation-duration:36s;animation-delay:-10s"><ellipse cx="1150" cy="170" rx="180" ry="24"/><ellipse cx="1230" cy="155" rx="100" ry="20"/></g>
    <g class="a cloud" style="animation-duration:44s;animation-delay:-20s"><ellipse cx="760" cy="330" rx="130" ry="16"/></g>
  </g>

  <!-- Birds -->
  <g class="bird" fill="none" stroke="#1a1330" stroke-width="3" stroke-linecap="round">
    <path d="M0 0 Q10 -10 20 0 Q30 -10 40 0"/>
    <g transform="translate(60,24)"><path d="M0 0 Q8 -8 16 0 Q24 -8 32 0"/></g>
  </g>

  <!-- Paris: far skyline, Seine, Eiffel Tower, near rooftops -->
  <defs><g id="farshapes"></g></defs>
  <g class="p1">
    <use href="#farshapes" fill="#6c5a92"/>
    <use class="a warm" href="#farshapes" fill="url(#warmg)"/>
  </g>

  <rect class="mist" x="-100" y="660" width="1800" height="140" fill="url(#mistg)"/>

  <!-- Seine with sun reflection -->
  <rect x="0" y="780" width="1600" height="120" fill="#1a1838"/>
  <rect class="a warm" x="0" y="780" width="1600" height="120" fill="url(#warmg)" opacity=".5"/>
  <g class="a refl" fill="#ffe7a8">
    <rect class="ripple" x="770" y="790" width="60" height="3"/><rect class="ripple" x="750" y="805" width="100" height="3" style="animation-delay:-.6s"/>
    <rect class="ripple" x="730" y="822" width="140" height="3" style="animation-delay:-1.2s"/><rect class="ripple" x="700" y="842" width="200" height="4" style="animation-delay:-1.8s"/>
    <rect class="ripple" x="670" y="866" width="260" height="4" style="animation-delay:-2.4s"/>
  </g>

  <!-- Eiffel Tower -->
  <g id="tower" fill="#1b1836">
    <path d="M688 782 L722 782 Q738 707 800 697 Q862 707 878 782 L912 782 L850 640 L828 520 L810 400 L803 330 L800 288 L797 330 L790 400 L772 520 L750 640 Z"/>
    <rect x="742" y="634" width="116" height="9"/><rect x="766" y="514" width="68" height="7"/><rect x="785" y="394" width="30" height="5"/>
    <g stroke="#1b1836" stroke-width="2" fill="none">
      <path d="M752 650 L848 780 M848 650 L752 780"/><path d="M776 528 L824 640 M824 528 L776 640"/>
    </g>
    <g class="a stars" fill="#ffd97a"><circle class="star" cx="800" cy="286" r="3"/><circle class="star" cx="800" cy="520" r="2"/><circle class="star" cx="760" cy="640" r="2"/><circle class="star" cx="840" cy="640" r="2"/><circle class="star" cx="720" cy="740" r="2"/><circle class="star" cx="880" cy="740" r="2"/></g>
  </g>

  <g id="near" fill="#1d1a3a"></g>
  <g id="windows" class="a stars" fill="#ffc861"></g>
  <path d="M0 900 V878 H1600 V900Z" fill="#100e24"/>

  <text class="a title" x="800" y="140" text-anchor="middle">Bonjour, Paris</text>
</svg>
</div>
<script>
  // Scatter stars deterministically so the field is stable across loads.
  (function () {
    var g = document.getElementById('starfield'), ns = 'http://www.w3.org/2000/svg', s = 7;
    function rnd() { s = (s * 16807) % 2147483647; return s / 2147483647; }
    for (var i = 0; i < 90; i++) {
      var c = document.createElementNS(ns, 'circle');
      c.setAttribute('cx', (rnd() * 1600).toFixed(0));
      c.setAttribute('cy', (rnd() * 520).toFixed(0));
      c.setAttribute('r', (0.6 + rnd() * 1.4).toFixed(1));
      c.setAttribute('class', 'star');
      c.style.animationDelay = (-rnd() * 3).toFixed(2) + 's';
      g.appendChild(c);
    }
  })();

  // Skyline: Haussmann-style blocks plus landmarks, generated deterministically.
  (function () {
    var ns = 'http://www.w3.org/2000/svg', s = 42;
    function rnd() { s = (s * 16807) % 2147483647; return s / 2147483647; }
    function el(parent, tag, attrs) { var e = document.createElementNS(ns, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }
    var far = document.getElementById('farshapes'), near = document.getElementById('near'), win = document.getElementById('windows');
    // far blocks
    for (var x = -60; x < 1660; x += 46 + rnd() * 30) {
      var w = 46 + rnd() * 30, h = 50 + rnd() * 45, top = 700 - h;
      el(far, 'polygon', {points: [x, 700, x, top + 12, x + 8, top, x + w - 8, top, x + w, top + 12, x + w, 700].join(' ')});
      if (rnd() > .6) el(far, 'rect', {x: x + w * .3, y: top - 12, width: 5, height: 12});
    }
    // Sacre-Coeur
    el(far, 'path', {d: 'M190 700 V630 H270 V700Z M198 630 Q198 590 230 584 Q262 590 262 630Z M168 660 Q168 636 184 632 Q200 636 200 660Z M260 660 Q260 636 276 632 Q292 636 292 660Z M229 584 V556 L232 556 V584Z'});
    // Notre-Dame
    el(far, 'path', {d: 'M1170 700 V620 H1290 V700Z M1188 620 V572 H1210 V620Z M1230 620 V572 H1252 V620Z M1216 620 V590 L1224 560 L1232 590 V620Z'});
    // Les Invalides
    el(far, 'path', {d: 'M1380 700 V636 H1470 V700Z M1392 636 V612 Q1392 570 1425 566 Q1458 570 1458 612 V636Z M1424 566 V532 L1426 532 V566Z'});
    // near rooftops (mansard) with lit windows
    var x2 = -20;
    while (x2 < 1620) {
      var w2 = 70 + rnd() * 50, h2 = 90 + rnd() * 55, t2 = 835 - h2, rh = 22;
      el(near, 'polygon', {points: [x2, 835, x2, t2 + rh, x2 + 10, t2, x2 + w2 - 10, t2, x2 + w2, t2 + rh, x2 + w2, 835].join(' ')});
      for (var wy = t2 + rh + 8; wy < 815; wy += 22)
        for (var wx = x2 + 10; wx < x2 + w2 - 12; wx += 18)
          if (rnd() > .55) el(win, 'rect', {x: wx, y: wy, width: 7, height: 10});
      x2 += w2 + 2;
    }
  })();
</script>
</body>
</html>
